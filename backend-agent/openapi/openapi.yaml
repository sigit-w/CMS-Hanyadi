openapi: 3.0.3
info:
  title: Bank Soal CMS API
  version: 0.4.0
  description: 'Fase 6u/6v — tryout_events adalah induk banyak tryout_sessions; satu sesi tepat satu mapel. status terjadwal/berlangsung/selesai adalah field turunan API, bukan kolom fisik; deadline CBT = min(start_at sesi + durasi sesi, ends_at induk). Fase 6w / ADR-019 menambah jenjang SD/SMP/SMA, username dan kredensial WA 8–15 digit, login participant memakai username dengan fallback email/nama, serta ekspor XLSX tryout-only tanpa identitas/tanggal dan dengan WAKTU Asia/Jakarta dari submission terakhir. Fase 6x / ADR-020 menambah PATCH /tryouts/{id} hanya untuk name/starts_at/ends_at tanpa mengubah slug, serta unduhan satu ZIP berisi PDF per sesi; varian berkunci memakai permission tryout_questions.key_export. Fase 6aa / ADR-023 mewajibkan jenjang pada soal, lembar soal, tryout, dan program belajar; semua respons content mengembalikan jenjang_kode/jenjang_nama, kode lembar berformat LS-<mapel>-<jenjang>-<mmyy> dengan mmyy UTC, dan slug tryout selalu dibangkitkan backend. Endpoint create/activate legacy tetap dipertahankan.'
security:
  - cookieAuth: []
servers:
  - url: http://127.0.0.1:8082
    description: API utama CMS
  - url: http://127.0.0.1:8083
    description: Presentation renderer
paths:
  /health:
    get:
      security: []
      summary: Kesehatan layanan dan koneksi database
      responses:
        '200':
          description: Sehat
        '503':
          description: Database tidak terhubung
  /api/v1/auth/login:
    post:
      security: []
      summary: Login pengguna (cookie access_token + refresh_token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: 'Username peserta yang dibangkitkan sistem untuk Siswa/Peserta Umum; email CMS atau fallback email/nama peserta lama tetap diterima.'
                password:
                  type: string
                  format: password
                  description: 'Password Siswa/CMS; PIN/WA 8–15 digit untuk Peserta Umum.'
                tryout_slug:
                  type: string
                  maxLength: 32
                  pattern: '^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?$'
                  description: 'Wajib untuk Peserta Umum/Siswa; slug sesi dari URL /{slug} yang dibagikan administrator. Slug induk tryout ditolak.'
      responses:
        '200': { description: Login berhasil; participant memiliki tryout_session_id }
        '400': { description: Username atau password kosong }
        '401': { description: 'Kredensial tidak valid, slug tidak valid, tautan tryout lama (TRYOUT_EVENT_SLUG), atau peserta tidak terdaftar pada sesi' }

        '429': { description: Akun dikunci sementara }
  /api/v1/auth/refresh:
    post:
      security: []
      summary: Rotasi refresh token dan terbitkan access token baru
      responses:
        '200': { description: Sesi diperbarui }
        '401': { description: Refresh token tidak valid }
  /api/v1/auth/logout:
    post:
      security: []
      summary: Cabut sesi dan hapus cookie
      responses:
        '200': { description: Logout berhasil }
  /api/v1/auth/me:
    get:
      summary: Data pengguna, role, permission, dan tryout_session_id aktif
      responses:
        '200': { description: Profil sesi }
        '401': { description: Sesi tidak valid }
  /api/v1/roles:
    get:
      summary: Daftar role (roles.manage)
      responses:
        '200': { description: Daftar role }
    post:
      summary: Buat atau perbarui role (roles.manage)
      responses:
        '201': { description: Role tersimpan }
        '400': { description: Validasi gagal }
  /api/v1/roles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      summary: Ubah nama/deskripsi/status role (roles.manage)
      responses:
        '200': { description: Role diperbarui }
    delete:
      summary: Nonaktifkan role non-sistem (roles.manage)
      responses:
        '200': { description: Role dinonaktifkan }
        '409': { description: Role sistem tidak bisa dihapus }
  /api/v1/roles/{id}/permissions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      summary: Ganti seluruh permission role (roles.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items: { type: string }
                  example: [questions.read, presentation.read]
      responses:
        '200': { description: Permission role diperbarui }
        '400': { description: Kode permission tidak valid }
        '404': { description: Role tidak ditemukan }
        '409': { description: Role admin tetap harus memiliki roles.manage }
  /api/v1/permissions:
    get:
      summary: Daftar 47 permission untuk checkbox RBAC (roles.manage)
      description: 'Mengembalikan seluruh kode permission aktif, termasuk opsi CRUD, permission agregat *.manage, dan tryout_questions.key_export dari migrasi 032. Permission baru tidak otomatis melekat pada role lama.'
      responses:
        '200': { description: Daftar 47 permission }
  /api/v1/users:
    get:
      summary: Daftar pengguna beserta role (roles.manage)
      responses:
        '200': { description: Daftar pengguna }
    post:
      summary: Buat pengguna CMS beserta role (roles.manage); role peserta ditolak
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, display_name, password, roles]
              properties:
                username: { type: string, pattern: '^[a-z0-9_.-]{3,32}$' }
                display_name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
                roles: { type: array, items: { type: string }, minItems: 1 }
      responses:
        '201': { description: Pengguna dibuat }
        '400': { description: Validasi gagal }
        '409': { description: Username atau email sudah dipakai }
  /api/v1/users/{id}/password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      summary: Ubah password pengguna (users.password.write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 12 }
                confirm_password: { type: string, format: password }
      responses:
        '200': { description: Password diperbarui; sesi lama dicabut }
        '400': { description: Validasi gagal }
        '404': { description: Pengguna tidak ditemukan atau tidak aktif }
  /api/v1/users/{id}/roles:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: Role yang dimiliki pengguna (roles.manage)
      responses:
        '200': { description: Daftar role pengguna }
    post:
      summary: Berikan role kepada pengguna (roles.manage)
      responses:
        '201': { description: Role diberikan }
  /api/v1/users/{id}/roles/{roleId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: roleId, in: path, required: true, schema: { type: integer } }
    delete:
      summary: Cabut role pengguna (roles.manage, guard admin terakhir)
      responses:
        '200': { description: Role dicabut }
        '409': { description: Admin terakhir tidak boleh dicabut }
  /api/v1/siswa:
    get:
      summary: Daftar Siswa murni dari public.siswa (tryouts.manage)
      description: 'Dipakai Kelola Siswa dan picker A. Peserta Didik; tidak menggabungkan prospektus. Fase 6u: pencarian server-side dipakai picker peserta. Fase 6z: username dan password plaintext ikut dikembalikan hanya untuk tryouts.manage agar bisa disalin berpasangan.'
      parameters:
        - { name: search, in: query, required: false, schema: { type: string }, description: 'Cari nama, email, kelas, atau sekolah (case-insensitive); alias q diterima.' }
        - { name: jenjang_id, in: query, required: false, schema: { type: integer }, description: 'Fase 6w: filter jenjang peserta.' }
      responses:
        '200': { description: Daftar siswa }
        '400': { description: jenjang_id tidak valid }
        '403': { description: Tidak memiliki permission tryouts.manage }
  /api/v1/participants:
    get:
      summary: Daftar peserta tryout beserta jumlah submission (tryouts.manage)
      parameters:
        - { name: prospek, in: query, required: false, schema: { type: boolean }, description: 'Filter status prospek Peserta Umum.' }
        - { name: search, in: query, required: false, schema: { type: string }, description: 'Fase 6u: cari nama, email, kelas, atau sekolah untuk picker Peserta Umum; alias q diterima.' }
        - { name: jenjang_id, in: query, required: false, schema: { type: integer }, description: 'Fase 6w: filter jenjang peserta.' }
      responses:
        '200': { description: Daftar peserta }
        '400': { description: Nilai prospek atau jenjang_id tidak valid }
        '403': { description: Tidak memiliki permission tryouts.manage }
    post:
      summary: Buat peserta tryout baru, Siswa atau Peserta Umum (tryouts.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [jenis, nama, sekolah, wa_orang_tua, jenjang_id]
                  properties:
                    jenis: { type: string, enum: [umum] }
                    nama: { type: string, maxLength: 128 }
                    sekolah: { type: string, maxLength: 255 }
                    jenjang_id: { type: integer, description: 'Wajib; ID dari /api/v1/jenjangs.' }
                    pin: { type: string, pattern: '^[0-9]{8,15}$', description: 'Opsional 8–15 digit; bila kosong memakai digit wa_orang_tua.' }
                    wa_orang_tua: { type: string, maxLength: 20, pattern: '^\+?[0-9][0-9 -]{6,18}$', description: 'Wajib; harus mengandung 8–15 digit.' }
                    username: { type: string, readOnly: true, description: 'Dibangkitkan dari jenjang, jam Asia/Jakarta, dan 4 digit WA.' }
                    prospek: { type: boolean, readOnly: true, description: 'True setelah dikeluarkan dari tryout; hanya untuk Umum.' }
                    prospek_at: { type: string, format: date-time, nullable: true, readOnly: true }
                - type: object
                  required: [nama, email, kelas, sekolah, jenjang_id]
                  properties:
                    jenis: { type: string, enum: [siswa], default: siswa }
                    nama: { type: string, maxLength: 128 }
                    email: { type: string, format: email }
                    kelas: { type: integer, minimum: 1, maximum: 100 }
                    sekolah: { type: string, maxLength: 255 }
                    jenjang_id: { type: integer, description: 'Wajib; ID dari /api/v1/jenjangs.' }
                    program_belajar_id: { type: integer, nullable: true }
                    wa_orang_tua: { type: string, maxLength: 20, nullable: true, description: 'Bila berisi 8–15 digit, dipakai sebagai password default dan username.' }
                    password:
                      type: string
                      format: password
                      minLength: 6
                      description: 'Opsional. Kosongkan untuk memakai digit WA bila valid, jika tidak nama depan@mmyy.'
                    username: { type: string, readOnly: true, description: 'Dibangkitkan dari jenjang, jam Asia/Jakarta, dan 4 digit WA.' }
                    prospek: { type: boolean, readOnly: true, description: 'False untuk Siswa.' }
                    prospek_at: { type: string, format: date-time, nullable: true, readOnly: true }
      responses:
        '201': { description: Peserta dibuat }
        '400': { description: Validasi gagal }
        '409': { description: Email/Nama Peserta Umum sudah digunakan }
  /api/v1/participants/{id}/detail:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: Detail peserta beserta password/PIN plaintext (tryouts.manage)
      description: 'Fase 6z: username dan plaintext tersedia pada detail dan pada endpoint list yang dilindungi tryouts.manage; hash tetap tidak pernah dikembalikan.'
      responses:
        '200': { description: Detail peserta }
        '404': { description: Peserta tidak ditemukan }
        '403': { description: Tidak memiliki permission tryouts.manage }
  /api/v1/prospektus:
    get:
      summary: Daftar Peserta Umum di tabel prospektus, termasuk status bergabung (tryouts.manage)
      description: 'Fase 6u: picker Peserta Umum memakai endpoint ini dengan search server-side; prospektus aktif boleh dilampirkan langsung, sedangkan yang bergabung=true dipetakan ke ID siswa hasil konversi. Fase 6z: username dan PIN plaintext ikut dikembalikan hanya untuk tryouts.manage.'
      parameters:
        - { name: search, in: query, required: false, schema: { type: string }, description: 'Cari nama, email, kelas, atau sekolah (case-insensitive); alias q diterima.' }
        - { name: jenjang_id, in: query, required: false, schema: { type: integer }, description: 'Fase 6w: filter jenjang prospektus.' }
      responses:
        '200': { description: Daftar prospektus }
        '400': { description: jenjang_id tidak valid }
        '403': { description: Tidak memiliki permission tryouts.manage }
  /api/v1/prospektus/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: Detail prospektus beserta PIN plaintext (tryouts.manage)
      responses:
        '200': { description: Detail prospektus }
        '404': { description: Prospektus tidak ditemukan }
        '403': { description: Tidak memiliki permission tryouts.manage }
  /api/v1/prospektus/{id}/daftar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      summary: Daftarkan prospektus sebagai siswa dan tandai bergabung (tryouts.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, kelas]
              properties:
                email: { type: string, format: email }
                kelas: { type: integer, minimum: 1, maximum: 100 }
                jenjang_id: { type: integer, description: 'Opsional; default jenjang_id prospektus.' }
                sekolah: { type: string, maxLength: 255, description: 'Opsional; default dari prospektus.' }
                program_belajar_id: { type: integer, nullable: true }
                wa_orang_tua: { type: string, maxLength: 20, description: 'Opsional; default dari prospektus.' }
                password: { type: string, format: password, minLength: 6, description: 'Opsional; default digit WA bila valid, jika tidak nama depan@mmyy.' }
                confirm_password: { type: string, format: password }
      responses:
        '201': { description: Siswa dibuat dan prospektus ditandai bergabung }
        '400': { description: Validasi gagal }
        '404': { description: Prospektus tidak ditemukan }
        '409': { description: Sudah bergabung atau email siswa dipakai }
  /api/v1/participants/{id}/prospek:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      summary: Tandai Peserta Umum dari daftar draft tryout sebagai prospek (tryouts.manage)
      description: 'Dipakai saat trash diklik sebelum tryout disimpan. Siswa ditolak 400.'
      responses:
        '200': { description: Peserta Umum menjadi prospek dan sesinya dicabut }
        '400': { description: Peserta bukan Umum }
        '404': { description: Peserta tidak ditemukan }
  /api/v1/participants/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      summary: Ubah data peserta; jenis tidak dapat diubah (tryouts.manage)
      description: 'Siswa memakai email/kelas/program; Peserta Umum memakai sekolah/WA. Nama dan PIN Umum tidak dapat diubah lewat endpoint password.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama, sekolah]
              properties:
                nama: { type: string, maxLength: 128 }
                sekolah: { type: string, maxLength: 255 }
                email: { type: string, format: email, description: 'Wajib untuk Siswa, tidak dipakai Umum.' }
                kelas: { type: integer, minimum: 1, maximum: 100, description: 'Wajib untuk Siswa, diabaikan Umum.' }
                program_belajar_id: { type: integer, nullable: true }
                wa_orang_tua: { type: string, maxLength: 20, nullable: true, description: 'Wajib untuk Umum.' }
                is_active: { type: boolean, default: true }
      responses:
        '200': { description: Peserta diperbarui }
        '404': { description: Peserta tidak ditemukan }
        '409': { description: Email/Nama Peserta Umum sudah digunakan }
    delete:
      summary: Nonaktifkan peserta dan cabut sesinya (tryouts.manage)
      responses:
        '200': { description: Peserta dinonaktifkan }
        '404': { description: Peserta tidak ditemukan }
  /api/v1/participants/{id}/password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      summary: Ubah password peserta dan cabut sesinya (tryouts.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 6 }
                confirm_password: { type: string, format: password }
      responses:
        '200': { description: Password diperbarui; sesi lama dicabut }
        '400': { description: Validasi gagal }
        '404': { description: Peserta tidak ditemukan atau tidak aktif }
  /api/v1/tryouts:
    get:
      summary: Daftar tryout induk beserta sesi dan status turunan (tryouts.manage)
      description: 'Satu baris per tryout_events. Response memuat event_id, name, slug, jenjang_kode/jenjang_nama, starts_at, ends_at, status (terjadwal/berlangsung/selesai), sessions[], kompatibilitas mapels[]/mapel_code, dan submission_count (API only). CMS tidak merender submission_count sebagai kolom Submission.'
      responses:
        '200':
          description: Daftar induk tryout
          content:
            application/json:
              schema:
                type: object
                properties:
                  tryouts:
                    type: array
                    items: { $ref: '#/components/schemas/TryoutEvent' }
        '403': { description: Tidak memiliki permission tryouts.manage }
    post:
      summary: Buat induk tryout dan banyak sesi (tryouts.manage)
      description: 'Fase 6y / ADR-021: kirim jenjang, name, starts_at, ends_at, participant_ids?, dan sessions[] minimal satu. Fase 6aa / ADR-023: jenjang wajib SD/SMP/SMA; slug induk selalu dibangkitkan backend dari nama + ID (field slug diabaikan). Tiap sesi wajib memuat tepat satu mapel_code dan minimal satu sheet_ids aktif berjenjang sama; question_ids dan payload flat legacy ditolak. Slug sesi dibangkitkan otomatis dan dipakai sebagai URL peserta. Respons memuat data.tryout dengan event_id, jenjang_kode/jenjang_nama, status turunan, sessions[], dan mapels[]/mapel_code legacy.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TryoutWrite'
      responses:
        '201':
          description: 'Induk tryout_events dan sesi-sesinya dibuat'
          content:
            application/json:
              schema:
                type: object
                properties:
                  tryout: { $ref: '#/components/schemas/TryoutEvent' }
        '400': { description: 'Validasi jenjang (wajib SD/SMP/SMA), jadwal, minimal satu sesi, minimal satu sheet_ids per sesi, mapel (satu mapel per sesi, duplikat antarsesi), lembar beda jenjang, question_ids/legacy ditolak, atau peserta gagal' }
        '403': { description: Tidak memiliki permission tryouts.manage }
  /api/v1/tryouts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: Detail induk tryout beserta sessions[] (tryouts.manage)
      description: 'Parameter id menerima event_id atau session_id lama. Respons memuat event_id, name, slug, jenjang_kode/jenjang_nama, starts_at, ends_at, status turunan, sessions[], mapels[]/mapel_code legacy, dan submission_count (API only).'
      responses:
        '200':
          description: Detail tryout
          content:
            application/json:
              schema:
                type: object
                properties:
                  tryout: { $ref: '#/components/schemas/TryoutEvent' }
        '404': { description: Tryout tidak ditemukan }
    patch:
      summary: Ubah hanya nama dan jadwal induk tryout (tryouts.manage)
      description: 'Fase 6x / ADR-020: tersedia untuk semua status turunan, tidak mengubah slug grup maupun slug/URL tiap sesi, tidak mengubah sesi/mapel/peserta/lembar soal, dan JWT peserta lama tetap valid.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, starts_at, ends_at]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 128 }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time, description: 'Harus setelah starts_at.' }
      responses:
        '200':
          description: Tryout diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  tryout: { $ref: '#/components/schemas/TryoutEvent' }
        '400': { description: Validasi gagal atau field di luar name/starts_at/ends_at dikirim }
        '403': { description: Tidak memiliki permission tryouts.manage }
        '404': { description: Tryout tidak ditemukan }
    delete:
      summary: Hapus Tryout dan relasinya (tryouts.manage); submission lama kehilangan session_id
      description: 'Menghapus seluruh sesi dan induknya lewat cascade; session_id lama tetap diterima sebagai parameter.'
      responses:
        '200': { description: Tryout dihapus }
        '404': { description: Tryout tidak ditemukan }
  /api/v1/tryouts/{id}/sessions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer }, description: 'event_id atau session_id lama.' }
    get:
      summary: Daftar semua sesi dari satu induk tryout (tryouts.manage)
      description: 'Setiap sesi tepat satu mapel (tryout_session_mapels dengan UNIQUE(session_id)) dan membawa pengaturan CBT per sesi.'
      responses:
        '200':
          description: Daftar sesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  tryout_event_id: { type: integer }
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/TryoutSession' }
        '403': { description: Tidak memiliki permission tryouts.manage }
        '404': { description: Tryout tidak ditemukan }
  /api/v1/tryouts/{id}/questions.zip:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer }, description: 'event_id atau session_id lama.' }
    get:
      summary: Unduh soal tryout sebagai satu ZIP berisi PDF per sesi (tryouts.manage)
      description: 'Fase 6x / ADR-020. Setiap PDF memuat nama lembar soal, kode lembar soal, mapel, dan keterangan. Tidak menyertakan kunci jawaban.'
      responses:
        '200':
          description: Arsip ZIP soal per sesi
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400': { description: ID tryout tidak valid }
        '403': { description: Tidak memiliki permission tryouts.manage }
        '404': { description: Tryout atau lembar soal tidak ditemukan }
  /api/v1/tryouts/{id}/questions-with-keys.zip:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer }, description: 'event_id atau session_id lama.' }
    get:
      summary: Unduh soal beserta kunci jawaban sebagai satu ZIP berisi PDF per sesi (tryout_questions.key_export)
      description: 'Fase 6x / ADR-020. Permission baru tidak otomatis diberikan ke role lama, termasuk admin; kunci berasal dari question_options.is_correct.'
      responses:
        '200':
          description: Arsip ZIP soal berkunci per sesi
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400': { description: ID tryout tidak valid }
        '403': { description: Tidak memiliki permission tryout_questions.key_export }
        '404': { description: Tryout atau lembar soal tidak ditemukan }
  /api/v1/tryouts/{id}/cbt:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Perbarui pengaturan CBT sebuah tryout (tryouts.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cbt_enabled: { type: boolean }
                cbt_duration_minutes: { type: integer, minimum: 1, maximum: 600, nullable: true }
                cbt_shuffle_questions: { type: boolean }
                cbt_shuffle_options: { type: boolean }
                cbt_require_fullscreen: { type: boolean }
                cbt_max_violations: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200': { description: Pengaturan CBT tersimpan; data tryout terbaru dikembalikan }
        '400': { description: Validasi pengaturan gagal }
        '403': { description: Tidak memiliki permission tryouts.manage }
        '404': { description: Tryout tidak ditemukan }
  /api/v1/tryouts/{id}/participants:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: Daftar peserta yang terlampir pada satu tryout (tryouts.manage)
      responses:
        '200': { description: Daftar peserta tryout }
        '403': { description: Tidak memiliki permission tryouts.manage }
        '404': { description: Tryout tidak ditemukan }
    post:
      summary: Lampirkan peserta existing ke tryout tersimpan (tryouts.manage)
      description: 'Dipakai popup Kelola Peserta. Relasi yang sudah ada dilewati; peserta nonaktif atau prospek ditolak.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participant_ids]
              properties:
                participant_ids: { type: array, items: { type: integer }, minItems: 1, maxItems: 200, description: 'ID dari /api/v1/participants.' }
      responses:
        '200': { description: 'Relasi tersimpan; added_ids berisi ID yang baru dilampirkan' }
        '400': { description: 'Validasi peserta gagal' }
        '403': { description: Tidak memiliki permission tryouts.manage }
        '404': { description: Tryout tidak ditemukan }
  /api/v1/tryouts/{id}/participants/{participantId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: participantId, in: path, required: true, schema: { type: integer } }
    delete:
      summary: Keluarkan peserta dari tryout tanpa menghapus data induk (tryouts.manage)
      description: 'Umum ditandai prospek, dinonaktifkan, dan sesinya dicabut. Siswa hanya terlepas dari tryout.'
      responses:
        '200': { description: Relasi dihapus; field prospek dikembalikan }
        '404': { description: Tryout, peserta, atau relasi tidak ditemukan }
        '403': { description: Tidak memiliki permission tryouts.manage }
  /api/v1/tryout-sessions:
    get:
      summary: Daftar sesi tryout untuk filter laporan (tryout_reports.read)
      description: 'Sumber data tryout_sessions + tryout_events + tryout_session_mapels + mapels. search memakai ILIKE partial case-insensitive pada nama induk, nama sesi, nama mapel, dan kode mapel; backslash, %, dan _ di-escape. Hasil diurutkan menurut event_name lalu id sesi. submission_count adalah jumlah baris submission, bukan jumlah peserta.'
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
          description: 'Teks pencarian opsional, maksimal 128 karakter setelah trim; ILIKE partial dengan escape wildcard; kosong berarti tanpa filter.'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
          description: 'Jumlah maksimal sesi yang dikembalikan; default 100, maksimal 200.'
        - name: jenjang_id
          in: query
          required: false
          schema: { type: integer }
          description: 'Fase 6w: batasi sesi yang memiliki peserta pada jenjang tertentu.'
      responses:
        '200':
          description: Daftar sesi beserta konteks induk dan mapel
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items: { $ref: '#/components/schemas/ReportTryoutSession' }
        '400': { description: 'search lebih dari 128 karakter atau limit bukan bilangan bulat 1..200' }
        '403': { description: Tidak memiliki permission tryout_reports.read }
    post:
      summary: Buat sesi tryout legacy dengan nama dan tanggal (tryout_reports.read)
      description: 'Endpoint legacy dipertahankan untuk klien lama. Payload wajib membawa event_id yang valid (alias eventId diterima). Fase 6v menghapus section pembuatan sesi dari halaman laporan; pembuatan sesi dilakukan di halaman manajemen tryout.'
      responses:
        '201': { description: Sesi dibuat }
        '400': { description: Validasi gagal }
        '403': { description: Tidak memiliki permission tryout_reports.read }
  /api/v1/tryout-sessions/{id}/activate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Jadikan satu sesi sebagai sesi aktif (tryout_reports.read)
      description: 'Endpoint legacy dipertahankan; tombol Aktifkan tidak lagi tersedia di halaman laporan Fase 6v.'
      responses:
        '200': { description: Sesi diaktifkan }
        '400': { description: Validasi gagal }
        '403': { description: Tidak memiliki permission tryout_reports.read }
        '404': { description: Sesi tidak ditemukan }
  /api/v1/reports/tryout:
    get:
      summary: Laporan tryout dikelompokkan per sesi, peserta, dan mapel (tryout_reports.read)
      parameters:
        - { name: session_id, in: query, schema: { type: integer } }
        - { name: jenjang_id, in: query, required: false, schema: { type: integer }, description: 'Fase 6w: filter jenjang peserta.' }
      responses:
        '200': { description: sessions, summary benar/salah/skor, details perbandingan jawaban, attempts CBT, dan violations }
        '403': { description: Tidak memiliki permission tryout_reports.read }
  /api/v1/reports/tryout/export.xlsx:
    get:
      summary: Unduh laporan tryout XLSX dengan filter sesi dan nama tryout (tryout_reports.read)
      description: 'Kedua filter digabung AND bila keduanya diisi; permission tryout_reports.read tidak diubah. Fase 6w / ADR-019: ekspor dipilih tryout-only lewat dropdown/popup CMS, bukan seluruh sesi. File memakai worksheet Laporan Tryout: baris 1 HASIL TRYOUT <nama> tanpa identitas NEW PRIMAGAMA YOGYAKARTA, tanggal, atau tanda tangan; header dua level pada baris 6-7 dengan A-E NO|NAMA SISWA|USER|ASAL SEKOLAH|WAKTU, grup per mapel B|S|NILAI dengan nama mapel dinamis, lalu TOTAL|RATA-RATA|RANKING. WAKTU = YYYY-MM-DD HH:mm:ss Asia/Jakarta dari submitted_at terakhir per peserta atau - bila belum submit. Data mulai baris 8 diurutkan TOTAL menurun. Catatan kaki memuat KETERANGAN, aturan B/S, kriteria pengurutan, dan statistik MAKSIMAL|MINIMAL|RATA-RATA per mapel. Tidak memuat kunci jawaban atau pembahasan.'
      parameters:
        - { name: session_id, in: query, required: false, schema: { type: integer }, description: 'Batasi ekspor pada satu sesi; tanpa parameter, ekspor semua sesi.' }
        - { name: jenjang_id, in: query, required: false, schema: { type: integer }, description: 'Fase 6w: filter jenjang peserta.' }
        - name: tryout_name
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
          description: 'Filter nama tryout opsional, maksimal 128 karakter; ILIKE case-insensitive/partial terhadap coalesce(event_name, session_name), dengan backslash, %, dan _ di-escape. Bila session_id juga diisi, digabung AND.'
      responses:
        '200':
          description: File XLSX; Content-Disposition mengikuti filter
          headers:
            Content-Disposition:
              description: 'attachment; filename laporan-tryout-<event_slug>-<session_slug>.xlsx saat filter dipakai dan slug tersedia, jika tidak laporan-tryout-semua.xlsx.'
              schema: { type: string }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '400': { description: 'session_id tidak valid atau tryout_name lebih dari 128 karakter/bukan string' }
        '403': { description: Tidak memiliki permission tryout_reports.read }
  /api/v1/tryout/questions:
    get:
      summary: Daftar soal approved untuk peserta; Fase 6u dibatasi pada satu sesi (tryout.access)
      description: 'Kirim session_id agar hanya soal sesi tersebut yang dimuat. Sesi harus masih berada di bawah induk tryout yang sama dan belum melewati ends_at.'
      parameters:
        - { name: mapel, in: query, schema: { type: string } }
        - { name: session_id, in: query, schema: { type: integer }, description: 'ID sesi dari GET /api/v1/tryouts/{id}/sessions atau /api/v1/presentation/sessions.' }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: Daftar soal sesi tanpa kunci jawaban }
        '401': { description: Sesi tidak aktif atau batas akhir induk terlampaui }
        '403': { description: Role tidak memiliki akses tryout }
        '404': { description: Sesi tidak tersedia untuk akun ini }
  /api/v1/question-sheets/generate-code:
    get:
      summary: Usulkan kode lembar soal berdasarkan jenjang dan mapel (question_sheets.manage)
      parameters:
        - { name: jenjang, in: query, required: true, schema: { $ref: '#/components/schemas/JenjangKode' }, description: 'Kode jenjang dari GET /api/v1/jenjangs.' }
        - { name: mapel, in: query, required: true, description: 'kode mapel 4 karakter dari GET /api/v1/mapels', schema: { type: string, pattern: '^[A-Z0-9]{4}$' } }
      responses:
        '200': { description: 'Kode usulan LS-<KODE_MAPEL>-<KODE_JENJANG>-mmyy; mmyy UTC dan cocok dengan ^LS-[A-Z0-9]{4}-(SD|SMP|SMA)-[0-9]{4}$' }
        '400': { description: Jenjang atau mapel wajib diisi, tidak valid, atau tidak ditemukan }
        '403': { description: Tidak memiliki permission question_sheets.manage }
  /api/v1/question-sheets/question-picker:
    get:
      summary: Pilih soal approved untuk lembar soal, difilter jenjang wajib dan mapel (question_sheets.manage)
      parameters:
        - { name: jenjang, in: query, required: true, schema: { $ref: '#/components/schemas/JenjangKode' }, description: 'Wajib; hanya soal pada jenjang ini.' }
        - { name: mapel, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: question_type, in: query, schema: { type: string, enum: [multiple_choice, true_false, multiple_answer, short_answer, essay] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: Daftar soal beserta pagination dan jenjang_kode/jenjang_nama }
        '400': { description: Jenjang atau tipe soal tidak valid }
        '403': { description: Tidak memiliki permission question_sheets.manage }
  /api/v1/question-sheets:
    get:
      summary: Daftar lembar soal aktif atau arsip dengan jenjang_kode/jenjang_nama (question_sheets.manage)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, archived], default: active } }
        - { name: mapel, in: query, schema: { type: string } }
        - { name: jenjang, in: query, schema: { $ref: '#/components/schemas/JenjangKode' }, description: 'Filter opsional kode jenjang.' }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: Daftar lembar soal beserta pagination dan jenjang_kode/jenjang_nama }
        '403': { description: Tidak memiliki permission question_sheets.manage }
    post:
      summary: Buat lembar soal beserta pilihan soal satu mapel dan jenjang (question_sheets.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionSheetWrite'
      responses:
        '201': { description: Lembar soal dibuat }
        '400': { description: Validasi gagal }
        '409': { description: Kode sudah digunakan }
        '403': { description: Tidak memiliki permission question_sheets.manage }
  /api/v1/question-sheets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: Detail lembar soal beserta daftar question_ids dan jenjang (question_sheets.manage)
      responses:
        '200': { description: 'Detail lembar soal dengan jenjang_kode/jenjang_nama' }
        '404': { description: Lembar soal tidak ditemukan }
    put:
      summary: Ubah lembar soal dan daftar soalnya secara transaksional (question_sheets.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionSheetWrite'
      responses:
        '200': { description: Lembar soal diperbarui }
        '400': { description: Validasi gagal }
        '409': { description: Kode bentrok atau sudah dipakai tryout }
        '404': { description: Lembar soal tidak ditemukan }
    delete:
      summary: Arsipkan lembar soal tanpa menghapus relasi (question_sheets.manage)
      responses:
        '200': { description: Lembar soal diarsipkan }
        '404': { description: Lembar soal tidak ditemukan }
  /api/v1/program-belajar:
    get:
      summary: Daftar program belajar beserta jenjang_kode/jenjang_nama (program_belajar.manage)
      responses:
        '200': { description: Daftar program belajar }
        '403': { description: Tidak memiliki permission program_belajar.manage }
    post:
      summary: Buat program belajar dengan jenjang wajib (program_belajar.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramBelajarWrite'
      responses:
        '201': { description: Program belajar dibuat }
        '400': { description: Validasi jenjang, nama, kelas, jadwal, atau biaya gagal }
        '403': { description: Tidak memiliki permission program_belajar.manage }
  /api/v1/program-belajar/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: Detail program belajar beserta jenjang_kode/jenjang_nama (program_belajar.manage)
      responses:
        '200': { description: Detail program belajar }
        '403': { description: Tidak memiliki permission program_belajar.manage }
        '404': { description: Program belajar tidak ditemukan }
    put:
      summary: Ubah program belajar dengan jenjang wajib (program_belajar.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramBelajarWrite'
      responses:
        '200': { description: Program belajar diperbarui }
        '400': { description: Validasi jenjang, nama, kelas, jadwal, atau biaya gagal }
        '403': { description: Tidak memiliki permission program_belajar.manage }
        '404': { description: Program belajar tidak ditemukan }
    delete:
      summary: Hapus program belajar (program_belajar.manage)
      responses:
        '200': { description: Program belajar dihapus }
        '403': { description: Tidak memiliki permission program_belajar.manage }
        '404': { description: Program belajar tidak ditemukan }
  /api/v1/jenjangs:
    get:
      summary: Daftar jenjang pendidikan aktif (questions.read atau mapels.manage)
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean, default: false }, description: 'Hanya untuk mapels.manage' }
      responses:
        '200': { description: Daftar jenjang beserta participant_count }
        '403': { description: Tidak memiliki permission questions.read atau mapels.manage }
    post:
      summary: Buat jenjang baru dengan kode unik (mapels.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kode, nama]
              properties:
                kode: { type: string, pattern: '^[A-Z0-9]{1,8}$', description: 'Disimpan uppercase; seed SD/SMP/SMA.' }
                nama: { type: string, maxLength: 64 }
                description: { type: string, maxLength: 1000, nullable: true }
                is_active: { type: boolean, default: true }
      responses:
        '201': { description: Jenjang dibuat }
        '400': { description: Validasi gagal }
        '403': { description: Tidak memiliki permission mapels.manage }
        '409': { description: Kode jenjang sudah digunakan }
  /api/v1/jenjangs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      summary: Ubah kode, nama, deskripsi, atau status jenjang (mapels.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kode, nama]
              properties:
                kode: { type: string, pattern: '^[A-Z0-9]{1,8}$' }
                nama: { type: string, maxLength: 64 }
                description: { type: string, maxLength: 1000, nullable: true }
                is_active: { type: boolean, default: true }
      responses:
        '200': { description: Jenjang diperbarui }
        '400': { description: Validasi gagal }
        '403': { description: Tidak memiliki permission mapels.manage }
        '404': { description: Jenjang tidak ditemukan }
        '409': { description: Kode jenjang sudah digunakan }
    delete:
      summary: Hapus jenjang yang belum dipakai peserta (mapels.manage)
      responses:
        '200': { description: Jenjang dihapus }
        '403': { description: Tidak memiliki permission mapels.manage }
        '404': { description: Jenjang tidak ditemukan }
        '409': { description: Jenjang masih dipakai peserta }
  /api/v1/mapels:
    get:
      summary: Daftar mapel aktif dengan tryout_count dari tryout_session_mapels (questions.read atau mapels.manage)
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean, default: false }, description: 'Hanya untuk mapels.manage' }
      responses:
        '200': { description: Daftar mapel beserta jumlah soal dan tryout }
        '403': { description: Tidak memiliki permission questions.read atau mapels.manage }
    post:
      summary: Buat mapel baru dengan kode unik (mapels.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, pattern: '^[A-Z0-9]{4}$' }
                name: { type: string, maxLength: 64 }
                description: { type: string, maxLength: 1000, nullable: true }
                is_active: { type: boolean, default: true }
      responses:
        '201': { description: Mapel dibuat }
        '400': { description: Validasi gagal }
        '403': { description: Tidak memiliki permission mapels.manage }
        '409': { description: Kode mapel sudah digunakan }
  /api/v1/mapels/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      summary: Ubah kode, nama, deskripsi, atau status mapel (mapels.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, pattern: '^[A-Z0-9]{4}$' }
                name: { type: string, maxLength: 64 }
                description: { type: string, maxLength: 1000, nullable: true }
                is_active: { type: boolean, default: true }
      responses:
        '200': { description: Mapel diperbarui }
        '400': { description: Validasi gagal }
        '404': { description: Mapel tidak ditemukan }
        '409': { description: Kode mapel sudah digunakan }
    delete:
      summary: Hapus mapel yang belum dipakai soal atau tryout (mapels.manage)
      responses:
        '200': { description: Mapel dihapus }
        '404': { description: Mapel tidak ditemukan }
        '409': { description: Mapel masih dipakai soal atau tryout }
  /api/v1/questions:
    get:
      summary: 'Daftar soal dengan filter jenjang/mapel; sheets berisi lembar aktif dan usage_count menghitung jumlah lembar aktif yang memakai soal (arsip tidak dihitung)'
      parameters:
        - { name: mapel, in: query, schema: { type: string } }
        - { name: jenjang, in: query, schema: { $ref: '#/components/schemas/JenjangKode' }, description: 'Filter kode jenjang SD/SMP/SMA.' }
        - name: status
          in: query
          description: "Gunakan archived untuk melihat soal yang dihapus"
          schema:
            $ref: '#/components/schemas/QuestionStatus'
        - { name: search, in: query, schema: { type: string } }
        - { name: question_type, in: query, schema: { type: string, enum: [multiple_choice, true_false, multiple_answer, short_answer, essay] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Daftar soal + pagination dengan jenjang_kode/jenjang_nama
        '400':
          description: Status, tipe soal, atau jenjang tidak valid
    post:
      summary: Buat soal manual dengan status approved otomatis (JSON atau multipart dengan payload + image PNG/JPEG/WebP/GIF; stem boleh kosong bila ada image)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jenjang, mapel, question_type]
              properties:
                stem: { type: string, nullable: true }
                jenjang: { $ref: '#/components/schemas/JenjangKode' }
                mapel: { type: string, pattern: '^[A-Z0-9]{4}$' }
                question_type: { type: string, enum: [multiple_choice, true_false, multiple_answer, short_answer, essay] }
                difficulty: { type: string, enum: [easy, medium, hard], default: medium }
                statements:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { $ref: '#/components/schemas/TrueFalseStatement' }
                  description: 'Wajib untuk true_false; stem/image_url menjadi cerita bersama'
                options:
                  type: array
                  maxItems: 6
                  items:
                    type: object
                    required: [key, content]
                    properties:
                      key: { type: string, pattern: '^[A-F]$' }
                      content: { type: string }
                      is_correct: { type: boolean, default: false }
                correct_keys:
                  type: array
                  minItems: 1
                  items: { type: string, pattern: '^[A-F]$' }
                  description: 'Semua kunci benar; wajib minimal 1 untuk multiple_answer'
                correct_key: { type: string, pattern: '^[A-F]$', deprecated: true, description: 'Kompatibilitas lama; diisi otomatis dari correct_keys[0]' }
                answer_text: { type: string, nullable: true }
                explanation: { type: string, nullable: true }
      responses:
        '201':
          description: 'Soal dibuat; respons memuat jenjang_kode/jenjang_nama'
        '400':
          description: Validasi gagal
  /api/v1/questions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: 'Detail soal, opsi, dan kunci jawaban; memuat jenjang_kode/jenjang_nama'
      responses:
        '200':
          description: Detail soal
        '404':
          description: Tidak ditemukan
    put:
      summary: Update soal (jenjang wajib; stem, mapel, tipe, kesulitan, opsi, kunci, pembahasan, gambar opsional)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jenjang]
              properties:
                stem: { type: string }
                jenjang: { $ref: '#/components/schemas/JenjangKode' }
                mapel: { type: string }
                question_type: { type: string, enum: [multiple_choice, true_false, multiple_answer, short_answer, essay] }
                difficulty: { type: string, enum: [easy, medium, hard] }
                statements:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { $ref: '#/components/schemas/TrueFalseStatement' }
                  description: 'Hanya untuk true_false; menggantikan seluruh pernyataan lama'
                options:
                  type: array
                  items:
                    type: object
                    required: [key, content]
                    properties:
                      key: { type: string }
                      content: { type: string }
                      is_correct: { type: boolean }
                correct_keys: { type: array, items: { type: string } }
                answer_text: { type: string, nullable: true }
                explanation: { type: string, nullable: true }
          multipart/form-data:
            schema:
              type: object
              properties:
                payload: { type: string, description: JSON string dari skema application/json }
                image: { type: string, format: binary }
      responses:
        '200':
          description: Berhasil
    delete:
      summary: Hapus soal dari daftar aktif dengan mengarsipkannya (questions.write)
      responses:
        '200':
          description: Berhasil, status menjadi archived
  /api/v1/questions/{id}/answer-key:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      summary: Upsert kunci jawaban (correct_keys untuk multi-jawaban; tidak dipakai untuk true_false yang memakai statements)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correct_keys: { type: array, items: { type: string, pattern: '^[A-F]$' } }
                correct_key: { type: string, pattern: '^[A-F]$', deprecated: true }
                answer_text: { type: string, nullable: true }
                explanation: { type: string, nullable: true }
      responses:
        '200':
          description: Berhasil
  /api/v1/uploads/{filename}:
    parameters:
      - { name: filename, in: path, required: true, schema: { type: string } }
    get:
      summary: Sajikan gambar soal yang diunggah
      responses:
        '200': { description: Gambar }
        '404': { description: Tidak ditemukan }
  /api/v1/import:
    post:
      summary: 'Impor soal dari file CSV atau XLSX saja (questions.write); payload tidak diterima'
      description: 'Fase 6aa/ADR-023: 19 header wajib dengan jenjang tepat setelah mapel: stem,mapel,jenjang,type,difficulty,option_a,option_b,option_c,option_d,correct_key,correct_keys,answer_text,explanation,statement_1,statement_1_correct,statement_1_explanation,statement_2,statement_2_correct,statement_2_explanation. Nilai jenjang harus SD/SMP/SMA. Template valid tersedia di /templates/template-soal.csv dan /templates/template-soal.xlsx.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 'File .csv atau .xlsx; header wajib 19 kolom dengan jenjang setelah mapel.'
                label:
                  type: string
                  description: 'Label sumber opsional.'
                external_ref:
                  type: string
                  nullable: true
                collected_from:
                  type: string
                  nullable: true
                metadata:
                  type: string
                  description: 'JSON string metadata opsional.'
      responses:
        '201':
          description: Soal berhasil diimpor
        '400':
          description: 'VALIDATION_ERROR untuk payload/format, header tanpa jenjang, atau nilai jenjang di luar SD/SMP/SMA; INVALID_IMPORT/EMPTY_IMPORT untuk isi file tidak valid lainnya'
        '403':
          description: Tidak memiliki permission questions.write
        '413':
          description: File terlalu besar
  /api/v1/sources:
    get:
      summary: Daftar sumber soal
      responses:
        '200':
          description: Daftar sumber
  /api/v1/research-submissions:
    get:
      summary: 'Antrean draft soal hasil riset agent; default need_review (permission questions.review)'
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ResearchSubmissionStatus' }
        - { name: mapel, in: query, schema: { type: string } }
        - { name: jenjang, in: query, schema: { $ref: '#/components/schemas/JenjangKode' } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Daftar draft + pagination
        '400':
          description: Status, tipe soal, jenjang, atau pagination tidak valid
    post:
      summary: 'Kirim draft soal hasil riset ke antrean review (permission research_submissions.create; belum publish)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchSubmissionCreate'
      responses:
        '201':
          description: Draft tersimpan dengan status need_review
        '400':
          description: Validasi soal gagal
        '409':
          description: external_ref dari source_system yang sama sudah ada
  /api/v1/research-submissions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: 'Detail draft beserta payload soal, opsi, dan pernyataan (permission questions.review)'
      responses:
        '200':
          description: Detail draft
        '404':
          description: Tidak ditemukan
  /api/v1/research-submissions/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      summary: 'Setujui draft: soal dibuat dengan status approved dalam satu transaksi (permission questions.review)'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                decision_note: { type: string, nullable: true }
      responses:
        '200':
          description: Draft menjadi approved dan question_id diisi
        '404':
          description: Tidak ditemukan
        '409':
          description: Draft sudah diproses
  /api/v1/research-submissions/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      summary: 'Tolak draft; tidak ada soal yang dibuat (permission questions.review)'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                decision_note: { type: string, nullable: true }
      responses:
        '200':
          description: Draft menjadi rejected
        '404':
          description: Tidak ditemukan
        '409':
          description: Draft sudah diproses
  /api/v1/research-query-config:
    get:
      summary: 'Baca konfigurasi query riset agent (permission research_queries.read; dipakai n8n)'
      responses:
        '200':
          description: Konfigurasi aktif
        '404':
          description: Konfigurasi tidak ditemukan
    put:
      summary: 'Ubah query, mapel, jenjang, dan jumlah soal riset (permission research_queries.manage)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchQueryConfigWrite'
      responses:
        '200':
          description: Konfigurasi tersimpan
        '400':
          description: Validasi query, mapel, jenjang, atau batas gagal
  /api/v1/research-agent-usage:
    get:
      summary: 'Pemakaian research agent bulan berjalan (permission research_queries.manage)'
      responses:
        '200':
          description: Jumlah siklus, search, soal, sisa kuota bulan ini
  /api/v1/research-agent-usage/start:
    post:
      summary: 'Reserve satu siklus riset; menolak bila agent dimatikan atau kuota bulanan habis (permission research_submissions.create)'
      responses:
        '200':
          description: 'allowed=true beserta konfigurasi aktif, atau allowed=false beserta reason'
  /api/v1/research-agent-usage/finish:
    post:
      summary: 'Catat jumlah search dan soal yang benar-benar dipakai (permission research_submissions.create)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [searches, questions]
              properties:
                searches: { type: integer, minimum: 0, maximum: 100 }
                questions: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: Pemakaian bulan berjalan diperbarui
        '400':
          description: Jumlah tidak valid
  /api/v1/presentation/sessions:
    get:
      summary: Daftar sesi tryout yang tersedia untuk peserta (presentation-service :8083)
      description: 'Dipakai tryout-agent per sesi. Peserta melihat sesi miliknya dari satu tryout_events; status induk turunan, penanda completed/submitted, dan pengaturan CBT per sesi dikembalikan. Setelah ends_at induk, permintaan ditolak 401 netral. Endpoint ini berada di presentation-service, bukan backend CMS.'
      responses:
        '200':
          description: Daftar sesi peserta
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/TryoutPresentationSession' }
        '401': { description: Sesi tidak valid, batas akhir tryout terlampaui, atau login diperlukan }
        '403': { description: Bukan akun peserta yang terdaftar pada induk tryout }
  /api/v1/presentation/questions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: session_id, in: query, required: false, schema: { type: integer }, description: 'Fase 6u: batasi soal pada satu sesi induk tryout yang sama.' }
    get:
      summary: Penyajian soal approved dari tabel inti tanpa kunci jawaban
      description: 'Soal ditolak 403 bila tidak termasuk sesi yang diminta; batas ends_at induk mengembalikan 410.'
      responses:
        '200':
          description: Konten soal siap disajikan
        '401': { description: Sesi tidak aktif }
        '403': { description: Soal tidak termasuk daftar tryout aktif }
        '404': { description: Soal approved tidak ditemukan }
        '410': { description: Batas akhir tryout induk terlampaui }
  /api/v1/presentation/questions/{id}/submit:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      summary: Kirim jawaban untuk disimpan dan dinilai di server tanpa feedback ke peserta
      responses:
        '200': { description: Konfirmasi penyimpanan tanpa is_correct, correct, atau explanation }
        '401': { description: Sesi tidak aktif }
        '403': { description: Akses tryout ditolak }
        '404': { description: Soal approved tidak ditemukan }
  /api/v1/presentation/cbt/attempt/start:
    post:
      summary: Mulai atau lanjutkan attempt CBT peserta per sesi (presentation.read)
      description: 'Kirim body { session_id } untuk memilih sesi. Deadline respon memuat deadline_at dan effective_deadline_at = min(start_at sesi + cbt_duration_minutes, ends_at induk).'
      responses:
        '200': { description: State attempt, daftar soal terpersonalisasi, draft, flag, dan deadline; tanpa skor/kunci }
        '403': { description: Peserta tidak terdaftar atau tryout bukan mode CBT }
        '409': { description: Mode CBT tidak aktif }
        '410': { description: Waktu habis }
  /api/v1/presentation/cbt/attempt:
    get:
      summary: Ambil state attempt CBT berjalan untuk satu sesi
      description: 'Kirim session_id di query. Autosave, flag, violation, dan finalize memakai session_id yang sama.'
      responses:
        '200': { description: State attempt tanpa skor/kunci }
        '404': { description: Attempt belum dimulai }
  /api/v1/presentation/cbt/attempt/autosave:
    post:
      summary: Simpan draft jawaban satu soal tanpa penilaian yang dikembalikan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id]
              properties:
                session_id: { type: integer, description: 'Sesi aktif dari daftar sesi peserta.' }
                question_id: { type: integer }
                answer: { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
                answer_text: { type: string }
                answers: { type: array, items: { type: object } }
      responses:
        '200': { description: Draft tersimpan; hanya question_id dan saved_at }
        '400': { description: Format jawaban tidak valid }
  /api/v1/presentation/cbt/attempt/flag:
    post:
      summary: Tandai atau hapus tanda ragu-ragu pada satu soal
      description: 'Body dapat memuat session_id untuk menargetkan sesi aktif.'
      responses:
        '200': { description: Status flag tersimpan }
  /api/v1/presentation/cbt/attempt/violation:
    post:
      summary: Catat pelanggaran fullscreen/tab; auto-submit saat batas terlampaui
      description: 'Body dapat memuat session_id; log pelanggaran di laporan tersembunyi sampai Lihat detail diklik.'
      responses:
        '200': { description: violation_count dan status attempt terbaru }
  /api/v1/presentation/cbt/attempt/finalize:
    post:
      summary: Kumpulkan seluruh draft menjadi submission final tanpa mengembalikan skor
      description: 'Body dapat memuat session_id. Selesai finalize, tryout-agent menawarkan lanjut ke sesi berikutnya atau keluar.'
      responses:
        '200': { description: status submitted dan submitted_at }
  /api/v1/presentation/attempts/submit-all:
    post:
      summary: Kirim seluruh jawaban non-CBT untuk satu sesi tanpa feedback (presentation.read)
      description: 'Body memuat session_id dan answers; seluruh jawaban ditulis dalam satu transaksi per sesi. Response tidak mengandung is_correct, correct, atau explanation. Sesi submitted terkunci dan batas ends_at induk mengembalikan 410.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                session_id: { type: integer, description: 'Sesi yang sedang dikerjakan.' }
                answers:
                  type: array
                  items: { type: object }
      responses:
        '200': { description: Jawaban tersimpan; tanpa skor ke peserta }
        '401': { description: Sesi tidak valid }
        '403': { description: Sesi tidak tersedia untuk akun ini }
        '409': { description: Mode CBT tidak mendukung submit-all }
        '410': { description: Batas akhir tryout terlampaui }
  /api/v1/presentation/attempts/summary:
    get:
      summary: Ringkasan jumlah jawaban terkirim dari database
      responses:
        '200': { description: attempted tanpa correct atau score }
        '401': { description: Sesi tidak aktif }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT HS256 TTL 15 menit; refresh_token menggantikan cookie ini.
  schemas:
    QuestionStatus:
      type: string
      enum: [approved, rejected, archived]
      description: approved adalah status publish; draft dan review tidak digunakan pada tabel questions
    ResearchSubmissionStatus:
      type: string
      enum: [need_review, approved, rejected]
      description: 'Status draft di tabel research_submissions; need_review menunggu keputusan reviewer CMS.'
    ResearchSubmissionCreate:
      type: object
      required: [stem, jenjang, mapel]
      properties:
        stem: { type: string, minLength: 1 }
        jenjang: { $ref: '#/components/schemas/JenjangKode' }
        mapel: { type: string, pattern: '^[A-Z0-9]{4}$' }
        question_type: { type: string, enum: [multiple_choice, true_false, multiple_answer, short_answer, essay], default: multiple_choice }
        difficulty: { type: string, enum: [easy, medium, hard], default: medium }
        statements:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/TrueFalseStatement' }
          description: 'Wajib untuk true_false'
        options:
          type: array
          maxItems: 6
          items:
            type: object
            required: [key, content]
            properties:
              key: { type: string, pattern: '^[A-F]$' }
              content: { type: string }
              is_correct: { type: boolean, default: false }
        correct_keys:
          type: array
          minItems: 1
          items: { type: string, pattern: '^[A-F]$' }
        correct_key: { type: string, pattern: '^[A-F]$', deprecated: true }
        answer_text: { type: string, nullable: true }
        explanation: { type: string, nullable: true }
        external_ref: { type: string, maxLength: 255, nullable: true, description: 'Id unik dari agent untuk dedupe' }
        source_url: { type: string, nullable: true }
        metadata: { type: object, description: 'run_id, model, confidence, dan provenance lain' }
    ResearchSubmission:
      type: object
      properties:
        id: { type: integer }
        status: { $ref: '#/components/schemas/ResearchSubmissionStatus' }
        source_system: { type: string }
        external_ref: { type: string, nullable: true }
        source_url: { type: string, nullable: true }
        stem: { type: string }
        mapel_code: { type: string }
        mapel_name: { type: string }
        jenjang_kode: { $ref: '#/components/schemas/JenjangKode' }
        jenjang_nama: { type: string }
        question_type: { type: string }
        payload: { type: object }
        metadata: { type: object }
        question_id: { type: integer, nullable: true }
        decision_note: { type: string, nullable: true }
        reviewed_by: { type: integer, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ResearchQueryConfigWrite:
      type: object
      required: [queries, mapel, jenjang]
      properties:
        queries:
          oneOf:
            - type: string
              description: 'Dipisah dengan | atau baris baru'
            - type: array
              items: { type: string }
              minItems: 1
              maxItems: 10
        mapel: { type: string, pattern: '^[A-Z0-9]{4}$' }
        jenjang: { $ref: '#/components/schemas/JenjangKode' }
        max_questions: { type: integer, minimum: 1, maximum: 10, default: 3 }
        is_enabled: { type: boolean, default: true }
        max_searches: { type: integer, minimum: 1, maximum: 5, default: 2 }
        max_results_per_query: { type: integer, minimum: 1, maximum: 10, default: 3 }
        max_output_tokens: { type: integer, minimum: 300, maximum: 4000, default: 1200 }
        max_runs_per_month: { type: integer, minimum: 1, maximum: 100, default: 25 }
    ResearchQueryConfig:
      type: object
      properties:
        queries:
          type: array
          items: { type: string }
        mapel: { type: string }
        jenjang: { $ref: '#/components/schemas/JenjangKode' }
        max_questions: { type: integer }
        is_enabled: { type: boolean }
        max_searches: { type: integer }
        max_results_per_query: { type: integer }
        max_output_tokens: { type: integer }
        max_runs_per_month: { type: integer }
        updated_by: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JenjangKode:
      type: string
      enum: [SD, SMP, SMA]
      description: Kode jenjang konten Fase 6aa / ADR-023; huruf kecil diterima backend dan dinormalisasi menjadi huruf besar.
    TrueFalseStatement:
      type: object
      required: [text, is_correct]
      properties:
        text: { type: string, maxLength: 1000 }
        is_correct: { type: boolean }
        explanation: { type: string, nullable: true }
    TryoutEventStatus:
      type: string
      enum: [terjadwal, berlangsung, selesai]
      description: 'Status turunan server dari starts_at/ends_at induk; bukan kolom fisik dan tidak mengubah is_active.'
    CbtSettings:
      type: object
      description: 'Pengaturan CBT per sesi tryout, bukan per induk.'
      properties:
        cbt_enabled: { type: boolean, default: false }
        cbt_duration_minutes: { type: integer, minimum: 1, maximum: 600, description: 'Wajib bila cbt_enabled=true; durasi per sesi.' }
        cbt_shuffle_questions: { type: boolean, default: false }
        cbt_shuffle_options: { type: boolean, default: false }
        cbt_require_fullscreen: { type: boolean, default: false }
        cbt_max_violations: { type: integer, minimum: 0, maximum: 100, default: 0, description: '0 = tanpa batas.' }
    TryoutSessionWrite:
      allOf:
        - $ref: '#/components/schemas/CbtSettings'
        - type: object
          required: [mapel_code]
          properties:
            name: { type: string, maxLength: 128, description: 'Opsional; default "<nama tryout> - <mapel_code>".' }
            mapel_code: { type: string, pattern: '^[A-Z0-9]{4}$', description: 'Tepat satu kode mapel aktif untuk sesi ini.' }
            sheet_ids: { type: array, minItems: 1, items: { type: integer }, description: 'Lembar aktif dengan mapel dan jenjang sama dengan sesi/induk; alternatif question_ids.' }
            question_ids: { type: array, minItems: 1, items: { type: integer }, description: 'Kompatibilitas; soal harus approved dengan mapel dan jenjang sama dengan sesi/induk.' }
            start_at: { type: string, format: date-time, nullable: true, description: 'Opsional; harus berada dalam rentang induk.' }
            end_at: { type: string, format: date-time, nullable: true, description: 'Opsional; harus berada dalam rentang induk dan setelah start_at.' }
            mapel_codes: { type: array, items: { type: string }, deprecated: true, description: 'Ditolak di Fase 6u: satu sesi hanya satu mapel_code.' }
    TryoutWrite:
      type: object
      required: [jenjang, name, starts_at, ends_at, sessions]
      properties:
        jenjang: { $ref: '#/components/schemas/JenjangKode' }
        name: { type: string, maxLength: 128 }
        slug: { type: string, readOnly: true, description: 'Ditolak/diabaikan; slug induk selalu dibangkitkan backend dari nama + ID.' }
        starts_at: { type: string, format: date-time, description: 'Batas awal induk (Asia/Jakarta).' }
        ends_at: { type: string, format: date-time, description: 'Batas akhir induk; setelah waktu ini status selesai dan sesi baru ditolak.' }
        participant_ids: { type: array, maxItems: 200, items: { type: integer }, description: 'Opsional; ID dari /api/v1/participants, siswa, atau prospektus aktif.' }
        sessions:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/TryoutSessionWrite' }
          description: 'Mapel antarsesi harus berbeda; setiap sesi tepat satu mapel.'
    LegacyTryoutWrite:
      allOf:
        - $ref: '#/components/schemas/CbtSettings'
        - type: object
          required: [name]
          anyOf:
            - required: [start_at, end_at]
            - required: [session_date]
          properties:
            name: { type: string, maxLength: 128 }
            slug: { type: string, maxLength: 32, pattern: '^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?$' }
            starts_at: { type: string, format: date-time, description: 'Alias Fase 6u untuk start_at.' }
            ends_at: { type: string, format: date-time, description: 'Alias Fase 6u untuk end_at.' }
            start_at: { type: string, format: date-time }
            end_at: { type: string, format: date-time }
            session_date: { type: string, format: date, description: 'Payload lama; rentang harian diturunkan bila start_at/end_at tidak dikirim.' }
            mapel_codes: { type: array, items: { type: string, pattern: '^[A-Z0-9]{4}$' }, minItems: 1, maxItems: 10, uniqueItems: true, description: 'Payload flat legacy; backend membuat satu sesi per mapel.' }
            mapel_code: { type: string, pattern: '^[A-Z0-9]{4}$', description: 'Field legacy; harus sama bila dikirim bersama mapel_codes.' }
            sheet_ids: { type: array, items: { type: integer }, minItems: 1, maxItems: 200 }
            question_ids: { type: array, items: { type: integer }, minItems: 1, maxItems: 200 }
            participant_ids: { type: array, items: { type: integer }, maxItems: 200 }
            is_active: { type: boolean, default: false }
    ReportTryoutSession:
      type: object
      description: 'Baris sesi pada GET /api/v1/tryout-sessions untuk picker filter laporan; event_* berasal dari induk tryout_events.'
      required: [id, name, slug, session_date, is_active, submission_count, event_id, event_name, mapel_code, mapel_name]
      properties:
        id: { type: integer }
        name: { type: string, description: 'Nama sesi.' }
        slug: { type: string }
        session_date: { type: string, format: date, nullable: true }
        is_active: { type: boolean }
        submission_count: { type: integer, description: 'Jumlah baris tryout_submissions, bukan jumlah peserta.' }
        event_id: { type: integer, description: 'ID induk tryout_events; wajib (NOT NULL).' }
        event_name: { type: string, description: 'Nama induk tryout_events; selalu terisi lewat join.' }
        mapel_code: { type: string, nullable: true }
        mapel_name: { type: string, nullable: true }
    TryoutSession:
      allOf:
        - $ref: '#/components/schemas/CbtSettings'
        - type: object
          properties:
            id: { type: integer }
            event_id: { type: integer }
            name: { type: string }
            slug: { type: string }
            session_date: { type: string, format: date, nullable: true }
            start_at: { type: string, format: date-time }
            end_at: { type: string, format: date-time }
            is_active: { type: boolean }
            status: { $ref: '#/components/schemas/TryoutEventStatus' }
            mapel_id: { type: integer, nullable: true, description: 'Mirror legacy.' }
            mapel_code: { type: string, nullable: true }
            mapel_name: { type: string, nullable: true }
            mapels:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  code: { type: string }
                  name: { type: string }
            question_ids: { type: array, items: { type: integer } }
            sheet_ids: { type: array, items: { type: integer } }
            participant_ids: { type: array, items: { type: integer } }
            submission_count: { type: integer, description: 'Field API/laporan; tidak dirender sebagai kolom Submission di daftar CMS.' }
    TryoutEvent:
      type: object
      properties:
        id: { type: integer, description: 'ID kompatibilitas: session_id untuk induk satu sesi, event_id untuk induk banyak sesi.' }
        event_id: { type: integer }
        tryout_event_id: { type: integer }
        parent_id: { type: integer }
        name: { type: string }
        slug: { type: string, description: 'Slug grup tryout (admin); bukan URL peserta. Gunakan sessions[].slug untuk URL/login.' }
        jenjang_kode: { $ref: '#/components/schemas/JenjangKode' }
        jenjang_nama: { type: string, description: 'Nama jenjang dari master jenjang.' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/TryoutEventStatus' }
        session_id: { type: integer, nullable: true }
        session_slug: { type: string, nullable: true, description: 'Slug sesi pertama; untuk multi-sesi gunakan sessions[].slug masing-masing.' }
        session_date: { type: string, format: date, nullable: true }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        is_active: { type: boolean }
        mapel_id: { type: integer, nullable: true }
        mapel_code: { type: string, nullable: true, description: 'Kompatibilitas: mapel sesi pertama/terendah.' }
        mapel_name: { type: string, nullable: true }
        mapels:
          type: array
          description: 'Kompatibilitas: agregat unik mapel seluruh sesi, diurutkan per kode.'
          items:
            type: object
            properties:
              id: { type: integer }
              code: { type: string }
              name: { type: string }
        question_ids: { type: array, items: { type: integer } }
        sheet_ids: { type: array, items: { type: integer } }
        participant_ids: { type: array, items: { type: integer } }
        question_count: { type: integer }
        sheet_count: { type: integer }
        participant_count: { type: integer }
        submission_count: { type: integer, description: 'API only; tidak ada kolom Submission di daftar tryout.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/TryoutSession' }
    TryoutPresentationSession:
      allOf:
        - $ref: '#/components/schemas/CbtSettings'
        - type: object
          properties:
            id: { type: integer }
            tryout_event_id: { type: integer }
            name: { type: string }
            slug: { type: string }
            mapel_code: { type: string, nullable: true }
            status: { $ref: '#/components/schemas/TryoutEventStatus' }
            start_at: { type: string, format: date-time }
            end_at: { type: string, format: date-time }
            completed: { type: boolean }
            submitted: { type: boolean }
    QuestionSheetWrite:
      type: object
      required: [name, jenjang, mapel_code, duration_minutes, question_ids]
      properties:
        name: { type: string, maxLength: 128 }
        jenjang: { $ref: '#/components/schemas/JenjangKode' }
        mapel_code: { type: string, pattern: '^[A-Z0-9]{4}$', description: 'kode mapel 4 karakter dari GET /api/v1/mapels; harus sama dengan mapel seluruh soal' }
        code: { type: string, pattern: '^LS-[A-Z0-9]{4}-(SD|SMP|SMA)-[0-9]{4}$', description: 'Opsional saat create; generator LS-<mapel>-<jenjang>-<mmyy> UTC dipakai bila kosong; jenjang pada kode harus sama dengan field jenjang.' }
        description: { type: string, maxLength: 1000, nullable: true }
        duration_minutes: { type: integer, minimum: 1, description: 'Angka bebas dalam menit, bukan preset' }
        question_ids:
          type: array
          minItems: 1
          items: { type: integer }
          description: 'Semua soal harus dari satu mapel dan jenjang yang sama dengan lembar soal'
    ProgramBelajarWrite:
      type: object
      required: [jenjang, name, kelas, schedules]
      properties:
        jenjang: { $ref: '#/components/schemas/JenjangKode' }
        name: { type: string, maxLength: 128 }
        kelas: { type: integer, minimum: 1, maximum: 12 }
        description: { type: string, maxLength: 1000, nullable: true }
        biaya: { type: number, minimum: 0, maximum: 999999999999.99, default: 0 }
        schedules:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [day, start_time, end_time]
            properties:
              day: { type: string, enum: [Senin, Selasa, Rabu, Kamis, Jumat, Sabtu, Minggu] }
              start_time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: 'HH:MM 24 jam.' }
              end_time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: 'HH:MM 24 jam, harus setelah start_time.' }
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            status: { type: integer }
